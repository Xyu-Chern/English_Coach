name: english-coach

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: english_coach
      POSTGRES_USER: english_coach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in translation_agent_demo/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # The official entrypoint runs these only when the data volume is empty.
      - type: bind
        source: ./storage/migrations/001_transcripts.sql
        target: /docker-entrypoint-initdb.d/001_transcripts.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./storage/migrations/002_podcast_sync.sql
        target: /docker-entrypoint-initdb.d/002_podcast_sync.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./storage/migrations/003_corpus_chunks.sql
        target: /docker-entrypoint-initdb.d/003_corpus_chunks.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./storage/migrations/004_corpus_embeddings.sql
        target: /docker-entrypoint-initdb.d/004_corpus_embeddings.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./storage/migrations/005_podcast_feed_reviews.sql
        target: /docker-entrypoint-initdb.d/005_podcast_feed_reviews.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./storage/migrations/006_corpus_observations.sql
        target: /docker-entrypoint-initdb.d/006_corpus_observations.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./storage/migrations/007_corpus_markdown.sql
        target: /docker-entrypoint-initdb.d/007_corpus_markdown.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./storage/migrations/008_transcript_review_scope.sql
        target: /docker-entrypoint-initdb.d/008_transcript_review_scope.sql
        read_only: true
        bind:
          create_host_path: false
      - ./storage/migrations/009_publisher_episode_ids.sql:/docker-entrypoint-initdb.d/009_publisher_episode_ids.sql:ro
      - type: bind
        source: ./docker/010_seed_transcript.sql
        target: /docker-entrypoint-initdb.d/010_seed_transcript.sql
        read_only: true
        bind:
          create_host_path: false
      # Local inspection material is optional and is never baked into an image.
      - type: bind
        source: ./docker/011_changelog_review.sql
        target: /docker-entrypoint-initdb.d/011_changelog_review.sql
        read_only: true
        bind:
          create_host_path: false
      - ./.local/transcripts:/bootstrap:ro
    healthcheck:
      # TCP is available after the entrypoint's temporary initialization server exits.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "english_coach", "-d", "english_coach"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  podcast-sync:
    build:
      context: .
      dockerfile: Dockerfile.sync
      args:
        EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
    environment:
      # libpq reads PGPASSWORD without interpolating special characters into a URI.
      DATABASE_URL: postgresql://english_coach@postgres:5432/english_coach
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in translation_agent_demo/.env}
      PODCAST_INDEX_API_KEY: ${PODCAST_INDEX_API_KEY:-}
      PODCAST_INDEX_API_SECRET: ${PODCAST_INDEX_API_SECRET:-}
      PODCAST_SYNC_ENABLED: ${PODCAST_SYNC_ENABLED:-true}
      CORPUS_BUILD_ENABLED: ${CORPUS_BUILD_ENABLED:-true}
      CORPUS_EMBED_ENABLED: ${CORPUS_EMBED_ENABLED:-false}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_EMBEDDING_API_KEY: ${OPENAI_EMBEDDING_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_TIMEOUT_SECONDS: ${OPENAI_EMBEDDING_TIMEOUT_SECONDS:-30}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      PODCAST_SYNC_FEED_IDS: ${PODCAST_SYNC_FEED_IDS:-542376}
    volumes:
      - ./.local/models:/app/translation_agent_demo/.local/models:ro
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
