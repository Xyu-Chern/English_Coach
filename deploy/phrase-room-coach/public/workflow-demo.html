<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#202c3c;font:15px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}
header{background:#172d3a;color:#fff;padding:15px 3.4%;display:flex;align-items:center;gap:14px}header strong{letter-spacing:-.5px;font-size:22px}

.grid{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(305px,1fr);gap:16px;align-items:start}
section,aside{background:#fff;border:1px solid #dce3e8;border-radius:13px;padding:19px 21px;margin:0 0 15px}
.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}
.flow{display:flex;align-items:stretch;gap:18px;flex-wrap:wrap}.node{position:relative;flex:1 1 88px;min-width:0;background:var(--soft);border:1px solid var(--tone);border-radius:8px;padding:10px 8px;text-align:left;color:#23303e;font:inherit;cursor:pointer}.node b{display:block;font-size:15px}.node small{display:block;font-size:12px;margin-top:4px}.node:not(:last-child)::after{content:'›';color:#8696a3;font:24px Georgia;position:absolute;right:-15px;top:25%}
.model{--tone:#7560aa;--soft:#f2eef9}.search{--tone:#4c82a2;--soft:#eaf4fa}.verify{--tone:#6486a4;--soft:#e8f0f8}.output{--tone:#526478;--soft:#ecf0f3}.extra{--tone:#93612f;--soft:#f8efe6}.failed{--tone:#b34b48;--soft:#fbe8e8}

@media(max-width:600px){.metrics div{padding:0 6px}.metrics strong{font-size:17px}.flow{display:grid;grid-template-columns:1fr 1fr}ol{columns:1}main{padding:16px}section,aside{padding:15px}.grid{display:block}}

header .badge{color:#385775;border-color:#b6c8db}header nav{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
header a,header button,#play{display:inline-flex;align-items:center;justify-content:center;color:#284e75;border:1px solid #acbfd3;background:#fff;border-radius:9px;min-height:40px;padding:4px 12px;font:inherit;text-decoration:none;cursor:pointer}
header a{font-weight:650;background:#dce9f7}.heading{flex-wrap:wrap}.model{--tone:#597ca4;--soft:#e9f1fa}.extra{--tone:#697a93;--soft:#eff1f6}.verify{--tone:#486984;--soft:#dce9f4}
#detail{min-height:48px;background:#edf3f9}.quote{color:#354f67}.expr a{color:#305778}.node.active{background:#d3e6fb}
.select,.prepare,.decline,.budget{--tone:#5d7c98;--soft:#e6eff9}.playing .node.active b{animation:hop .8s ease-in-out infinite}@keyframes hop{50%{transform:translateY(-4px)}}
button:focus-visible,a:focus-visible{outline:3px solid #366998;outline-offset:2px}
@media(max-width:600px){header{gap:8px}header nav{width:100%;margin:0}.metrics{grid-template-columns:1fr 1fr;row-gap:10px}.metrics div:nth-child(2){border:0}footer{overflow-wrap:anywhere}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}

<script type="application/json" id="run">{"id": "3cb18014-3453-443c-bc15-6aa38f2aebbd", "question": "和同事聊天时，我想用 by the way 自然地换个话题，顺便问问他面试怎么样了。我可以怎么说？", "response": {"expressions": [{"expression": "By the way, how did your interview go?", "citation": {"quote": "So one day he walked into our office and said \"Oh, by the way, I've written a compiler for your language.\" That was an amazing moment for us.", "episode_title": "Go Time #100", "episode_url": "https://changelog.com/gotime/100"}}, {"expression": "By the way, how was the interview?", "citation": null}, {"expression": "Oh, by the way, how did the interview go?", "citation": null}], "note": null}, "recorded_at": "2026-11-22T23:48:55.095765+00:00", "metrics": {"steps": [{"stage": "candidates", "status": "ok", "start_ms": 0.014561000000412605, "elapsed_ms": 10137.004718000015, "input_tokens": 943, "output_tokens": 461}, {"stage": "search_1", "status": "ok", "start_ms": 10137.112150000008, "hit_count": 3, "elapsed_ms": 20.178052000005664}, {"stage": "search_2", "status": "ok", "start_ms": 10171.611965000011, "hit_count": 3, "elapsed_ms": 22.328042999987474}, {"stage": "search_3", "status": "ok", "start_ms": 10195.643689000008, "hit_count": 3, "elapsed_ms": 39.95605200000796}, {"stage": "search_4", "status": "ok", "start_ms": 10237.445304999994, "hit_count": 3, "elapsed_ms": 39.81370400001083}, {"stage": "search_5", "status": "ok", "start_ms": 10278.773612000008, "hit_count": 3, "elapsed_ms": 26.643962000008514}, {"stage": "search_6", "status": "ok", "start_ms": 10312.176967, "hit_count": 3, "elapsed_ms": 28.90716600001042}, {"stage": "select_1", "status": "ok", "start_ms": 10351.104267000012, "elapsed_ms": 12365.523276999995, "input_tokens": 11626, "output_tokens": 591}, {"stage": "validate_select_1", "status": "ok", "start_ms": 22717.097982000014, "verified": 1, "elapsed_ms": 0.0}, {"stage": "agent_1", "status": "ok", "start_ms": 22717.187198000003, "elapsed_ms": 7094.029769999992, "input_tokens": 13486, "output_tokens": 290}, {"stage": "repick_1_1", "status": "ok", "start_ms": 29811.45112499999, "elapsed_ms": 0.0}, {"stage": "repick_1_2", "status": "ok", "start_ms": 29811.468902, "elapsed_ms": 0.0}, {"stage": "repick_1_3", "status": "ok", "start_ms": 29811.49175799999, "elapsed_ms": 0.0}, {"stage": "validate_agent_1", "status": "ok", "start_ms": 29811.518463999986, "verified": 1, "elapsed_ms": 0.0}, {"stage": "assemble", "status": "ok", "start_ms": 29811.569646000007, "elapsed_ms": 0.0, "expressions": 3, "with_example": 1}], "usage": {"input_tokens": 26055, "output_tokens": 1342, "embedding_tokens": 0, "total_chat_calls": 3, "cached_input_tokens": 0, "reported_chat_calls": 3}, "status": "ok", "variant": "agent", "searches": 6, "verified": 1, "elapsed_ms": 29811.62892399999, "error_code": null, "expressions": 3, "model_rounds": 3}}</script>
<script>"use strict";
// Each label describes an operation reported by the running coach.
function workflowStage(stage, lang) {
  const labels = {
    prepare: ["接收问题", "질문 받기"],
    model: ["想几个英文说法", "영어 표현 떠올리기"],
    search: ["找播客原句", "팟캐스트 예문 찾기"],
    select: ["挑选合适的例句", "알맞은 예문 고르기"],
    verify: ["核对原句和出处", "원문과 출처 확인하기"],
    extra: ["调整表达或例句", "표현과 예문 다듬기"],
    output: ["整理回答", "답변 정리하기"],
    decline: ["说明回答范围", "답할 수 있는 범위 안내"],
    budget: ["结束本轮查找", "이번 검색 마무리"],
  };
  let kind = "extra";
  if (stage === "prepare") kind = "prepare";
  else if (stage.startsWith("candidates")) kind = "model";
  else if (stage.startsWith("validate")) kind = "verify";
  else if (stage.includes("search")) kind = "search";
  else if (/^(select|pick_final|repick)/.test(stage)) kind = "select";
  else if (stage === "assemble") kind = "output";
  else if (stage === "decline") kind = "decline";
  else if (stage === "budget_exhausted") kind = "budget";
  return {kind, label: labels[kind][lang === "ko" ? 1 : 0]};
}
</script>
<script>
const $ = id => document.getElementById(id);
const run = JSON.parse($('run').textContent);
const m = run.metrics, steps = m.steps;
const pageUrl = new URL(location.href);
let stored;
try { stored = JSON.parse(localStorage.getItem('phrase-room.language')); } catch {}
let lang = pageUrl.searchParams.get('lang') || stored || 'zh';
const t = (zh, ko) => lang === 'ko' ? ko : zh;
const seconds = ms => (ms / 1000).toFixed(2) + t(' 秒','초');
const when = new Date(run.recorded_at);
function add(parent, tag, text='', cls='') {
  const item = document.createElement(tag);
  item.textContent = text;
  item.className = cls;
  parent.append(item);
  return item;
}
const info = step => workflowStage(step.stage, lang);
let chosen = 0, timer = null;
function stop() {
  clearInterval(timer);
  timer = null;
  document.body.classList.remove('playing');
  $('play').textContent = t('▶ 快速回放','▶ 빠르게 다시 보기');
}
function select(i) {
  chosen = i;
  const s = steps[i];
  const details = [info(s).label, t('开始于 ','시작 ') + seconds(s.start_ms), t('用时 ','소요 ') + seconds(s.elapsed_ms)];
  if (s.hit_count != null) details.push(t('找到 '+s.hit_count+' 段字幕','자막 '+s.hit_count+'개 찾음'));
  if (s.verified != null) details.push(t('核实 '+s.verified+' 条','예문 '+s.verified+'개 확인'));
  if (s.skipped) details.push(t('已跳过','건너뜀'));
  if (s.status === 'error') details.push(t('失败','실패'));
  $('detail').textContent = details.join(' · ');
  document.querySelectorAll('[data-step]').forEach(n => n.classList.toggle('active',
    +n.dataset.step <= i && i <= +(n.dataset.end || n.dataset.step)));
}
function attach(button,index,last=index) {
  button.dataset.step=index; button.dataset.end=last;
  button.title=info(steps[index]).label+' · '+steps[index].stage;
  button.setAttribute('aria-label',button.title);
  button.onclick=()=>{stop();select(index)};
}
function render() {
  stop();
  document.documentElement.lang=t('zh-CN','ko');
  document.title = 'English Coach · '+t('工作流回放','실행 과정 다시 보기');
  $('badge').textContent=t('工作流回放','실행 과정 다시 보기');
  $('back').textContent=t('← 返回继续提问','← 돌아가서 질문하기');
  $('back').href='https://phrase-room-coach.vercel.app/?lang='+lang+'#continue';
  $('language').textContent=t('한국어','中文');
  $('share').textContent=t('复制分享链接','공유 링크 복사');
  $('share').hidden=location.protocol!=='https:';
  $('stamp').textContent=when.toLocaleString(document.documentElement.lang,{timeZoneName:'short'});
  $('question').textContent=run.question||t('这次教练做了什么？','코치는 어떻게 답했을까요?');
  $('path-title').textContent=t('执行顺序','진행 순서');
  $('variant').textContent=(m.variant==='agent'?t('智能体','에이전트'):m.variant)+' · '+(m.status==='ok'?t('完成','완료'):t('失败','실패'));
  $('timeline-title').textContent=t('每一步花了多久','단계별 소요 시간');
  $('legend').textContent=t('◆ 一瞬间完成的步骤','◆ 바로 끝난 단계');
  $('steps-title').textContent=t('逐步查看','단계별로 보기');
  $('result-title').textContent=run.response?t('教练回答','코치의 답변'):t('运行结果','실행 결과');
  $('verified').textContent=t('例句已核实 ','확인된 예문 ')+m.verified+' / '+m.expressions;
  $('origin').textContent=t('运行编号 ','실행 ID ')+run.id;
  for(const id of ['metrics','flow','lanes','events','answers']) $(id).replaceChildren();
  const tokens=m.usage.input_tokens==null||m.usage.output_tokens==null?t('未报告','정보 없음'):(m.usage.input_tokens+m.usage.output_tokens).toLocaleString();
  for(const [label,value] of [[t('总用时','전체 소요 시간'),seconds(m.elapsed_ms)],[t('模型调用','모델 호출'),m.model_rounds],[t('字幕检索','자막 검색'),m.searches],[t('模型 Token','모델 토큰'),tokens]]){
    const item=add($('metrics'),'div');add(item,'small',label);add(item,'strong',value);
  }
  const groups=[];
  steps.forEach((step,i)=>{
    const {kind,label}=info(step);
    if(groups.at(-1)?.kind!==kind)groups.push({kind,label,first:i,last:i,ms:0});
    const g=groups.at(-1);g.last=i;g.ms+=step.elapsed_ms;
  });
  for(const g of groups){
    const n=add($('flow'),'button','','node '+g.kind);add(n,'b',g.label);add(n,'small',seconds(g.ms));attach(n,g.first,g.last);
  }
  const ax=add($('lanes'),'div','','axis');add(ax,'span',t('经过时间','경과 시간'));
  const ticks=add(ax,'div','','ticks');
  for(let i=0;i<5;i++)add(ticks,'i',(m.elapsed_ms*i/4000).toFixed(1)+'s').style.left=i*25+'%';
  const tracks=new Map(), total=Math.max(1,m.elapsed_ms);
  steps.forEach((s,i)=>{
    const {kind,label}=info(s);
    if(!tracks.has(kind)){const row=add($('lanes'),'div','','lane');add(row,'span',label);tracks.set(kind,add(row,'div','','track'))}
    const bar=add(tracks.get(kind),'button','','bar '+(s.status==='error'?'failed':kind)+(s.elapsed_ms===0?' mark':''));
    bar.style.left=Math.min(100,100*s.start_ms/total)+'%';bar.style.width=s.elapsed_ms/total*100+'%';attach(bar,i);
    const btn=add(add($('events'),'li'),'button','',kind);add(btn,'i');add(btn,'span',label);add(btn,'em',seconds(s.elapsed_ms));attach(btn,i);
  });
  $('play').disabled=!steps.length;
  if(steps.length)select(Math.min(chosen,steps.length-1));
  for(const expr of run.response?.expressions||[]){
    const card=add($('answers'),'article','','expr');add(card,'h3',expr.expression);
    if(expr.citation){add(card,'p','“'+expr.citation.quote+'”','quote');const a=add(card,'a',expr.citation.episode_title+' ↗');if(/^https?:\/\//.test(expr.citation.episode_url||''))a.href=expr.citation.episode_url;}
    else add(card,'small',t('没有已核实的播客引文','확인된 팟캐스트 인용문이 없어요'),'meta');
  }
  if(!$('answers').children.length)add($('answers'),'p',m.status==='ok'?(run.response?.note||t('返回 '+m.expressions+' 个表达，其中 '+m.verified+' 个带有已核实的播客原句。','표현 '+m.expressions+'개 중 '+m.verified+'개에 확인된 팟캐스트 예문이 있어요.')):t('这次未能生成回答。','이번에는 답변을 만들지 못했어요.'));
}
$('language').onclick=()=>{
  lang=t('ko','zh');pageUrl.searchParams.set('lang',lang);
  if(location.protocol==='https:')history.replaceState(null,'',pageUrl);
  try{localStorage.setItem('phrase-room.language',JSON.stringify(lang))}catch{}
  render();
};
$('back').onclick=e=>{
  if(window.parent!==window){e.preventDefault();parent.postMessage({action:'continue-coaching',lang},'*')}
};
$('play').onclick=()=>{
  if(timer){stop();return}
  select(0);document.body.classList.add('playing');$('play').textContent=t('暂停','일시 정지');
  timer=setInterval(()=>{if(chosen+1>=steps.length){stop();return}select(chosen+1)},800);
};
$('share').onclick=async()=>{
  try{await navigator.clipboard.writeText(pageUrl.href);$('share').textContent=t('已复制','복사했어요')}
  catch{window.prompt(t('复制回放链接','링크를 복사하세요'),pageUrl.href)}
};
render();
</script></html>
