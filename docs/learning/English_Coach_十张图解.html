const overview=el('flow').closest('section'),more=document.querySelector('.more');
overview.insertAdjacentHTML('beforebegin','<div id="modes" aria-label="阅读方式"><button id="simpleMode">看概览</button><button id="deepMode">跟着代码走</button></div>');
more.insertAdjacentHTML('beforebegin',`<section id="deep"><div class="tag" id="stepCount"></div><div id="deepStage"><h2 id="stepTitle"></h2><div class="deep-state"><div><small>这一步收到</small><b id="before"></b></div><span aria-hidden="true">→</span><div><small>处理之后</small><b id="after"></b></div></div><p id="reason"></p><details id="codeBox"><summary>展开这几行真代码</summary><pre><code id="snippet"></code></pre><a id="sourceLine"></a></details></div><div id="deepQuiz"><h2 id="question"></h2><div id="choices"></div><p id="feedback" role="status"></p><details id="practice"><summary>动手验证</summary><p id="practiceText"></p></details></div><nav><button id="stepBack">← 上一步</button><button class="next" id="stepNext"></button></nav></section>`);
let deepMode=true, step=0;
const stateDiagram=document.querySelector('.deep-state');
el('reason').insertAdjacentHTML('afterend', `<div id="commitDemo" hidden>

 <p id="commitNote"></p><div class="row"><button id="powerCut">⚡ 写到一半断电</button><button id="finishBoth">✓ 顺利写完并提交</button></div></div>`);
function displayCommit(outcome){
 const success=outcome==='success';
 el('savedText').textContent=success?'有，重启后还能读到':'没有本次新增的字幕';
 el('doneText').textContent=success?'已完成':'还没完成';
 el('commitNote').textContent=success?'两项都写好，数据库确认保存。下次就知道第 2 集已经处理完了。':outcome==='cut'?'重启后：字幕那一笔虽然先写了，但还没提交，数据库会撤回它。第 2 集仍可重试。':'开始时：字幕刚下载到程序手里。程序接着要做两件事：把字幕存进库，再给任务打勾。选一种结果看看。';
}
el('powerCut').onclick=()=>displayCommit('cut');
el('finishBoth').onclick=()=>displayCommit('success');
function renderLesson(){
 const lesson=lessons[active], quiz=step===3;
 const together=active===0&&step===2;
 stateDiagram.hidden=together;el('commitDemo').hidden=!together;el('reason').hidden=together;
 if(together)displayCommit('start');
 overview.hidden=deepMode;more.hidden=deepMode;el('deep').hidden=!deepMode;
 el('simpleMode').setAttribute('aria-pressed',String(!deepMode));el('deepMode').setAttribute('aria-pressed',String(deepMode));
 el('deepStage').hidden=quiz;el('deepQuiz').hidden=!quiz;el('stepCount').textContent=quiz?'预测结果':'代码推演 · '+(step+1)+' / 3';
 el('stepBack').disabled=step===0;el('stepNext').textContent=['下一步 →','下一步 →','我来判断 →','从头看 ↺'][step];
 if(!quiz){
 const [title,before,after,reason,file,line,code]=lesson[0][step];
 for(const [id,value] of Object.entries({stepTitle:title,before,after,reason,snippet:code}))el(id).textContent=value;
 el('codeBox').open=false;el('sourceLine').href='../../translation_agent_demo/'+file;el('sourceLine').textContent=file.split('/').pop()+' · 第 '+line+' 行起 ↗';
 }else{
 el('question').textContent=lesson[1];el('choices').replaceChildren();el('feedback').textContent='';el('practice').open=false;el('practiceText').textContent=cards[active][17];
 lesson[2].forEach((answer,i)=>{const b=document.createElement('button');b.textContent=answer;b.onclick=()=>{el('feedback').textContent=(i===lesson[3]?'判断正确。':'再看这个条件。')+lesson[4]};el('choices').append(b)});
 }
}
function selectCard(i){show(i);step=0;renderLesson()}
el('simpleMode').onclick=()=>{deepMode=false;renderLesson()};el('deepMode').onclick=()=>{deepMode=true;renderLesson()};
el('stepBack').onclick=()=>{step=Math.max(0,step-1);renderLesson()};el('stepNext').onclick=()=>{step=(step+1)%4;renderLesson()};
pick.onchange=()=>selectCard(Number(pick.value));el('prev').onclick=()=>selectCard(Math.max(0,active-1));el('next').onclick=()=>selectCard(Math.min(9,active+1));
function enter(){const m=location.hash.match(/^#deep-(10|[1-9])(?:-([1-3]))?$/);deepMode=true;selectCard(m?Number(m[1])-1:0);if(m&&m[2]){step=Number(m[2])-1;renderLesson()}}
window.addEventListener('hashchange',enter);enter();
</script></html>
